<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socialo Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>

<div class="container">

    <div class="logo-section">
        <img th:src="@{/images/socialo-logo.png}" alt="Socialo Logo" class="logo">
        <h1>Socialo</h1>
        <p class="tagline">
            <span class="c-teal">Connect.</span>
            <span class="c-orange">Share.</span>
            <span class="c-pink">Inspire.</span>
        </p>
    </div>

    <div class="card">
        <h2>Welcome Back!</h2>
        <p class="subtitle">Login to continue to <span>Socialo</span></p>

        <!-- Error Message -->
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <!-- Suspended — show appeal link -->
        <div th:if="${suspended}" style="background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.4);color:#fcd34d;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.88rem;text-align:center;">
            Your account has been suspended.
            <a th:href="@{/appeal}" style="color:#fbbf24;font-weight:700;display:block;margin-top:6px;">
                <i class="fa-solid fa-scale-balanced"></i> Appeal this decision
            </a>
        </div>
        <!-- Success Message (from signup redirect) -->
        <div th:if="${success}" class="alert-success" th:text="${success}"></div>

        <form th:action="@{/login}" method="post" autocomplete="off">

            <div class="input-group">
                <i class="fa-regular fa-user icon"></i>
                <input type="text" name="emailOrPhone" placeholder="Phone or Email" autocomplete="off" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="passwordField" name="password" placeholder="Password" autocomplete="new-password" required>
                <i class="fa-regular fa-eye-slash eye" id="eyeToggle" style="cursor:pointer;" onclick="togglePassword()"></i>
            </div>

            <div class="forgot">
                <a th:href="@{/forgot-password}">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                <span>Login</span>
                <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </button>

        </form>

        <div class="divider"><span>OR</span></div>

        <a th:href="@{/signup}" class="google-btn" style="text-decoration:none; justify-content:center;">
            <i class="fa-solid fa-user-plus" style="font-size:20px;"></i>
            <span>Create New Account</span>
        </a>

    </div>

    <div class="footer">
        <p>
            Don't have an account?
            <a th:href="@{/signup}">Sign Up <i class="fa-solid fa-chevron-right"></i></a>
        </p>
    </div>

</div>

<style>
.alert-error {
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.4);
    color: #fca5a5;
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 18px;
    font-size: .9rem;
    text-align: center;
}
.alert-success {
    background: rgba(34,197,94,.15);
    border: 1px solid rgba(34,197,94,.4);
    color: #86efac;
    padding: 12px 16px;
    border-radius: 14px;
    margin-bottom: 18px;
    font-size: .9rem;
    text-align: center;
}
</style>

<script>
function togglePassword() {
    const field = document.getElementById('passwordField');
    const icon = document.getElementById('eyeToggle');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    } else {
        field.type = 'password';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    }
}
</script>

</body>
</html>

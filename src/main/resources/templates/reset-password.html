<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Socialo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div><div class="orb orb4"></div>
<div class="container">
    <div class="logo-section">
        <img th:src="@{/images/socialo-logo.png}" alt="Socialo" class="logo">
        <h1>Socialo</h1>
    </div>
    <div class="card">
        <div class="lock-icon"><i class="fa-solid fa-lock-open"></i></div>
        <h2>Set new password</h2>
        <p class="subtitle">Choose a strong password of at least <span>6 characters</span>.</p>

        <div th:if="${error}" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.88rem;text-align:center;" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" name="newPassword" placeholder="New password" required minlength="6">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" name="confirmPassword" placeholder="Confirm new password" required minlength="6">
            </div>
            <button type="submit" class="send-btn">
                <span>Reset Password</span>
                <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        </form>
        <div class="back-login"><a th:href="@{/login}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></div>
    </div>
</div>
</body>
</html>

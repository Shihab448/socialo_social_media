<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Socialo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div><div class="orb orb4"></div>
<div class="container">
    <div class="logo-section">
        <img th:src="@{/images/socialo-logo.png}" alt="Socialo" class="logo">
        <h1>Socialo</h1>
    </div>
    <div class="card">
        <div style="text-align:center;margin-bottom:18px;">
            <i class="fa-solid fa-envelope-open-text" style="font-size:2.5rem;color:#1d4ed8;"></i>
        </div>
        <h2 style="text-align:center;margin-bottom:8px;">Verify your email</h2>
        <p style="color:#8da2a8;font-size:.9rem;text-align:center;margin-bottom:16px;">
            We sent a 6-digit code to <strong th:text="${email}">your email</strong>.<br>
            Enter it below to activate your account.
        </p>

        <!-- Spam notice -->
        <div style="background:rgba(255,176,0,.12);border:1px solid rgba(255,176,0,.3);color:#fcd34d;
                    padding:10px 14px;border-radius:14px;margin-bottom:16px;font-size:.8rem;text-align:center;line-height:1.5;">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <strong>Email inbox-এ না পেলে Spam/Junk folder চেক করো।</strong><br>
            Spam-এ পেলে <strong>"Not spam"</strong> click করো।
        </div>

        <div th:if="${error}" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.88rem;text-align:center;" th:text="${error}"></div>
        <div th:if="${info}"  style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#86efac;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.88rem;text-align:center;" th:text="${info}"></div>

        <form th:action="@{/verify-email}" method="post">
            <div class="input-group">
                <i class="fa-solid fa-key icon"></i>
                <input type="text" name="code" placeholder="6-digit code"
                       maxlength="6" pattern="\d{6}"
                       style="letter-spacing:6px;font-size:1.2rem;font-weight:700;text-align:center;"
                       required autofocus>
            </div>
            <button type="submit" class="login-btn" style="margin-top:8px;">
                <span>Verify</span>
                <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        </form>

        <form th:action="@{/verify-email/resend}" method="post" style="margin-top:16px;text-align:center;">
            <button type="submit"
                    style="border:none;background:transparent;color:#00e5d4;font-size:.88rem;cursor:pointer;font-family:inherit;">
                Resend code
            </button>
        </form>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Post - Socialo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/post-view.css}">
    <style>
        .share-page{max-width:560px;margin:0 auto;padding:24px 16px;}
        .share-card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(15,23,42,.06);margin-bottom:16px;}
        .share-input{width:100%;border:1px solid #e2e8f0;border-radius:14px;padding:12px 16px;font-size:.95rem;font-family:inherit;outline:none;}
        .share-input:focus{border-color:#1d4ed8;}
        .share-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:13px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;text-decoration:none;}
        .copy-btn{background:#1d4ed8;color:#fff;}
        .wa-btn{background:#25D366;color:#fff;}
        .fb-btn{background:#1877F2;color:#fff;}
        .tw-btn{background:#1da1f2;color:#fff;}
    </style>
</head>
<body>
<header class="topbar">
    <a th:href="@{/home}" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Share Post</h2>
    <div></div>
</header>

<div class="share-page">

    <!-- Post preview -->
    <div class="share-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
            <img th:src="${post.user.displayProfileImage}" alt=""
                 style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
            <div>
                <strong th:text="${post.user.fullName}">Name</strong>
                <p style="font-size:.8rem;color:#6b7280;"
                   th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy')}">Date</p>
            </div>
        </div>
        <p th:if="${post.caption != null}" th:text="${post.caption}"
           style="font-size:.92rem;color:#374151;margin-bottom:10px;"></p>
        <th:block th:if="${post.firstImageUrl != null}">
            <img th:src="${post.firstImageUrl}" alt="Post"
                 style="width:100%;max-height:260px;object-fit:contain;border-radius:12px;background:#f8fafc;">
        </th:block>
    </div>

    <!-- Share options -->
    <div class="share-card">
        <h3 style="font-size:1rem;font-weight:700;margin-bottom:14px;">Share via</h3>

        <div style="display:flex;gap:8px;margin-bottom:14px;">
            <input type="text" id="shareLinkInput" class="share-input"
                   th:value="${shareUrl}" readonly>
        </div>

        <button class="share-btn copy-btn" onclick="copyLink()">
            <i class="fa-regular fa-copy"></i> Copy Link
        </button>
        <a id="waLink" href="#" target="_blank" class="share-btn wa-btn">
            <i class="fa-brands fa-whatsapp"></i> Share on WhatsApp
        </a>
        <a id="fbLink" href="#" target="_blank" class="share-btn fb-btn">
            <i class="fa-brands fa-facebook"></i> Share on Facebook
        </a>
        <a id="twLink" href="#" target="_blank" class="share-btn tw-btn">
            <i class="fa-brands fa-twitter"></i> Share on Twitter/X
        </a>
    </div>

</div>

<script>
const shareUrl = document.getElementById('shareLinkInput').value;
const fullUrl  = window.location.origin + shareUrl;
document.getElementById('waLink').href = 'https://wa.me/?text=' + encodeURIComponent(fullUrl);
document.getElementById('fbLink').href = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(fullUrl);
document.getElementById('twLink').href = 'https://twitter.com/intent/tweet?url=' + encodeURIComponent(fullUrl);

function copyLink() {
    navigator.clipboard.writeText(fullUrl).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        btn.style.background = '#22c55e';
        setTimeout(() => {
            btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy Link';
            btn.style.background = '';
        }, 2500);
    });
}
</script>
</body>
</html>

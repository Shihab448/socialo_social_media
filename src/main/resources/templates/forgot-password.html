<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Socialo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/forget-password.css}">
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="orb orb4"></div>

<div class="container">

    <div class="logo-section">
        <img th:src="@{/images/socialo-logo.png}" alt="Socialo Logo" class="logo">
        <h1>Socialo</h1>
    </div>

    <div class="card">
        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h2>Forgot Password?</h2>
        <p class="subtitle">Enter your <span>email or phone number</span> and we'll help you reset it.</p>

        <div th:if="${success}" style="background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.4);color:#86efac;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.9rem;text-align:center;" th:text="${success}"></div>
        <div th:if="${error}" style="background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-size:.9rem;text-align:center;" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="input-group">
                <i class="fa-solid fa-envelope icon"></i>
                <input type="text" name="emailOrPhone" placeholder="Email or Phone" required>
            </div>
            <button type="submit" class="send-btn">
                <span>Send Reset Link</span>
                <span class="arrow"><i class="fa-solid fa-chevron-right"></i></span>
            </button>
        </form>

        <div class="back-login">
            <a th:href="@{/login}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>

</div>

</body>
</html>
